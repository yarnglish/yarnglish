<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarnglish Translator</title>
    <style>
        /* Reset & Base System Typography */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-page: #f4f6fb;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef2ff;
            --accent: #0d9488;
            --accent-soft: #f0fdfa;
            --danger: #e11d48;
            --danger-soft: #fff1f2;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
            background-color: var(--bg-page);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .header-inner {
            max-width: 1120px;
            margin: 0 auto;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            font-weight: 800;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
            flex-shrink: 0;
        }

        .brand-title h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-main);
            line-height: 1.2;
        }

        .brand-title p {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Main Container */
        main {
            flex: 1;
            max-width: 1120px;
            width: 100%;
            margin: 0 auto;
            padding: 24px 20px 48px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Translator Grid */
        .translator-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Mode Switcher Bar */
        .mode-bar {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 8px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .lang-pill {
            flex: 1;
            text-align: center;
            padding: 10px 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            user-select: none;
            cursor: pointer;
        }

        .lang-pill.source-active {
            background-color: var(--primary-soft);
            color: var(--primary);
        }

        .lang-pill.target-active {
            background-color: var(--accent-soft);
            color: var(--accent);
        }

        .swap-btn {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .swap-btn:hover {
            background-color: var(--primary);
            border-color: var(--primary);
            color: #ffffff;
        }

        .swap-btn:active {
            transform: scale(0.94);
        }

        .swap-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        /* Two-Column IO Cards */
        .io-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        @media (min-width: 768px) {
            .io-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card.input-card:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .card-header {
            padding: 12px 16px;
            background-color: var(--bg-subtle);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-header.output-header {
            background-color: #f5f7ff;
        }

        .card-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .card-header.output-header .card-label {
            color: var(--primary);
        }

        .btn-sm {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-clear {
            background-color: transparent;
            color: var(--text-muted);
        }

        .btn-clear:hover {
            background-color: var(--danger-soft);
            color: var(--danger);
        }

        .btn-copy {
            background-color: var(--primary);
            color: #ffffff;
            box-shadow: 0 1px 2px rgba(79, 70, 229, 0.2);
        }

        .btn-copy:hover {
            background-color: var(--primary-hover);
        }

        .btn-copy:active {
            transform: scale(0.96);
        }

        textarea.translator-input {
            width: 100%;
            flex: 1;
            min-height: 165px;
            padding: 16px;
            border: none;
            outline: none;
            resize: vertical;
            font-family: inherit;
            font-size: 1.05rem;
            color: var(--text-main);
            background: transparent;
            line-height: 1.6;
        }

        textarea.translator-input::placeholder {
            color: #94a3b8;
        }

        .translator-output {
            width: 100%;
            flex: 1;
            min-height: 165px;
            padding: 16px;
            font-size: 1.05rem;
            color: var(--text-main);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            user-select: all;
        }

        .placeholder-text {
            color: #94a3b8;
            font-style: italic;
            font-size: 0.98rem;
            user-select: none;
        }

        .card-footer {
            padding: 10px 16px;
            background-color: var(--bg-subtle);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .sample-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .sample-chip {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .sample-chip:hover {
            border-color: var(--primary);
            background-color: var(--primary-soft);
            color: var(--primary);
        }

        .stats-badge {
            font-weight: 600;
            color: var(--accent);
        }

        /* Dictionary Reference Section */
        .dict-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .dict-header {
            padding: 16px 20px;
            background-color: var(--bg-subtle);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .dict-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dict-title-wrap h2 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .dict-hint {
            font-size: 0.75rem;
            color: var(--text-muted);
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .search-box {
            position: relative;
            width: 100%;
            max-width: 280px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.85rem;
            color: var(--text-main);
            background-color: #ffffff;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .search-box svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: #94a3b8;
            pointer-events: none;
        }

        .dict-grid {
            padding: 18px 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .dict-chip {
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .dict-chip:hover {
            background-color: var(--primary-soft);
            border-color: #c7d2fe;
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .dict-chip:active {
            transform: translateY(0);
        }

        .dict-en {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dict-chip:hover .dict-en {
            color: var(--primary);
        }

        .dict-yn {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.82rem;
            color: var(--accent);
            font-weight: 600;
            word-break: break-all;
        }

        .empty-dict {
            grid-column: 1 / -1;
            text-align: center;
            padding: 28px 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0f172a;
            color: #ffffff;
            padding: 10px 16px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 50;
            opacity: 0;
            transform: translateY(16px);
            pointer-events: none;
            transition: all 0.25s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast svg {
            width: 16px;
            height: 16px;
            color: #34d399;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-inner">
            <div class="brand">
                <div class="brand-logo" aria-hidden="true">Y</div>
                <div class="brand-title">
                    <h1>Yarnglish Translator</h1>
                    <p>Official Two-Way Dictionary Translator</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Translator Section -->
        <section class="translator-section" aria-label="Translator">
            <!-- Direction Toggle & Swap Bar -->
            <div class="mode-bar">
                <div id="sourceLangPill" class="lang-pill source-active" role="button" tabindex="0" title="Translate from English">
                    English
                </div>

                <button id="swapBtn" type="button" class="swap-btn" title="Swap languages & move output to input" aria-label="Swap languages">
                    <svg id="swapIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/>
                    </svg>
                </button>

                <div id="targetLangPill" class="lang-pill target-active" role="button" tabindex="0" title="Translate to Yarnglish">
                    Yarnglish
                </div>
            </div>

            <!-- Input & Output Cards -->
            <div class="io-grid">
                <!-- Input Card -->
                <div class="card input-card">
                    <div class="card-header">
                        <span id="inputHeaderLabel" class="card-label">English Input</span>
                        <button id="clearBtn" type="button" class="btn-sm btn-clear">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                            </svg>
                            Clear
                        </button>
                    </div>

                    <textarea id="sourceInput" class="translator-input" placeholder="Type here... e.g. I am a boy, you are a girl!"></textarea>

                    <div class="card-footer">
                        <div class="sample-group">
                            <span>Samples:</span>
                            <button type="button" class="sample-chip"
                                data-en="I am a boy."
                                data-yn="piep pape poi.">
                                Statement
                            </button>
                            <button type="button" class="sample-chip"
                                data-en="One, Two, Three!"
                                data-yn="ooooooe, pops, pipepepes!">
                                Numbers
                            </button>
                            <button type="button" class="sample-chip"
                                data-en="Nonbinary?"
                                data-yn="puar?">
                                Genders
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Output Card -->
                <div class="card">
                    <div class="card-header output-header">
                        <span id="outputHeaderLabel" class="card-label">Yarnglish Output</span>
                        <button id="copyBtn" type="button" class="btn-sm btn-copy">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                            </svg>
                            <span id="copyBtnText">Copy</span>
                        </button>
                    </div>

                    <div id="targetOutput" class="translator-output" aria-live="polite">
                        <span class="placeholder-text">Translation appears here automatically...</span>
                    </div>

                    <div class="card-footer">
                        <span>Unknown words stay unchanged.</span>
                        <span id="matchStats" class="stats-badge">0 words translated</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Interactive Reference Dictionary -->
        <section class="dict-card" aria-label="Official Dictionary">
            <div class="dict-header">
                <div class="dict-title-wrap">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4f46e5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 016.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/>
                    </svg>
                    <h2>Reference Dictionary</h2>
                    <span class="dict-hint">Click any card to insert</span>
                </div>

                <div class="search-box">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                    </svg>
                    <input type="text" id="dictSearch" placeholder="Search English or Yarnglish..." aria-label="Filter dictionary">
                </div>
            </div>

            <div id="dictionaryGrid" class="dict-grid">
                <!-- Populated by JavaScript -->
            </div>
        </section>
    </main>

    <!-- Toast Feedback -->
    <div id="toast" class="toast" role="status" aria-live="polite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span id="toastMessage">Copied!</span>
    </div>

    <script>
        (function () {
            "use strict";

            /**
             * STRICT USER-PROVIDED YARNGLISH DICTIONARY
             * Only these exact words are used; no new Yarnglish words are ever invented.
             */
            const YARNGLISH_DICTIONARY = {
                "hi": "eeeeeeeeeeeeeeello",
                "hello": "eeeeeeeeeeeeello",
                "bye": "byeeeeeeee apapapa",
                "i": "piep",
                "me": "piepe",
                "you": "eepaap",
                "yar": "paeeeeeeeeeeeeeeeeeeeeeeeeeeeee",
                "joba": "eeeeeeeeeeeapapapapapapapapapapa",
                "carl": "popopeeeeeeeeeepa",
                "is": "pip",
                "are": "pipe",
                "am": "pape",
                "im": "piep pip",
                "youre": "eepaap pip",
                "boy": "poi",
                "girl": "gipipi",
                "english": "eeeeeenglish",
                "yarnglish": "paeeengliish",
                "one": "ooooooe",
                "two": "pops",
                "three": "pipepepes",
                "nonbinary": "puar"
                "astralix": "pipipaapipix"
            };

            /**
             * Reverse Lookup Dictionary (Yarnglish -> English)
             * Multi-word Yarnglish phrases are matched before single-word tokens.
             */
            const REVERSE_DICTIONARY = {
                "eeeeeeeeeeeeeeello": "hi",
                "eeeeeeeeeeeeello": "hello",
                "byeeeeeeee apapapa": "bye",
                "piep": "i",
                "piepe": "me",
                "eepaap": "you",
                "paeeeeeeeeeeeeeeeeeeeeeeeeeeeee": "yar",
                "eeeeeeeeeeeapapapapapapapapapapa": "joba",
                "popopeeeeeeeeeepa": "carl",
                "pip": "is",
                "pipe": "are",
                "pape": "am",
                "piep pip": "im",
                "eepaap pip": "youre",
                "poi": "boy",
                "gipipi": "girl",
                "eeeeeenglish": "english",
                "paeeengliish": "yarnglish",
                "ooooooe": "one",
                "pops": "two",
                "pipepepes": "three",
                "puar": "nonbinary"
                "pipipaapipix": "astralix"
            };

            // Pre-sorted multi-word Yarnglish keys (longest first) for accurate reverse matching
            const MULTI_WORD_YARNGLISH = Object.keys(REVERSE_DICTIONARY)
                .filter(key => key.includes(" "))
                .sort((a, b) => b.length - a.length);

            // Application State
            let isEnglishToYarnglish = true;
            let currentRawTranslation = "";
            let toastTimer = null;

            // DOM References
            const sourceInput = document.getElementById("sourceInput");
            const targetOutput = document.getElementById("targetOutput");
            const swapBtn = document.getElementById("swapBtn");
            const swapIcon = document.getElementById("swapIcon");
            const sourceLangPill = document.getElementById("sourceLangPill");
            const targetLangPill = document.getElementById("targetLangPill");
            const inputHeaderLabel = document.getElementById("inputHeaderLabel");
            const outputHeaderLabel = document.getElementById("outputHeaderLabel");
            const clearBtn = document.getElementById("clearBtn");
            const copyBtn = document.getElementById("copyBtn");
            const copyBtnText = document.getElementById("copyBtnText");
            const matchStats = document.getElementById("matchStats");
            const dictionaryGrid = document.getElementById("dictionaryGrid");
            const dictSearch = document.getElementById("dictSearch");
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");

            /**
             * Display non-blocking toast message
             */
            function showToast(msg) {
                toastMessage.textContent = msg;
                toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove("show");
                }, 2200);
            }

            /**
             * Translate English -> Yarnglish
             */
            function translateEnglishToYarnglish(text) {
                let translatedCount = 0;
                const tokens = text.split(/([A-Za-z0-9]+(?:'[A-Za-z0-9]+)*)/);

                const result = tokens.map(token => {
                    if (!token || !/^[A-Za-z0-9]/.test(token)) {
                        return token;
                    }

                    const normalized = token.toLowerCase().replace(/'/g, "");

                    if (Object.prototype.hasOwnProperty.call(YARNGLISH_DICTIONARY, normalized)) {
                        translatedCount++;
                        return YARNGLISH_DICTIONARY[normalized];
                    }

                    return token;
                }).join("");

                return { text: result, count: translatedCount };
            }

            /**
             * Translate Yarnglish -> English
             */
            function translateYarnglishToEnglish(text) {
                let translatedCount = 0;
                const placeholders = [];
                let workingText = text;

                MULTI_WORD_YARNGLISH.forEach(phrase => {
                    const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                    const regex = new RegExp(`(^|[^A-Za-z0-9])(${escaped})(?=$|[^A-Za-z0-9])`, "gi");

                    workingText = workingText.replace(regex, (match, prefix) => {
                        const index = placeholders.length;
                        placeholders.push(REVERSE_DICTIONARY[phrase]);
                        translatedCount++;
                        return `${prefix}__YNPH_${index}__`;
                    });
                });

                const tokens = workingText.split(/([A-Za-z0-9_]+)/);

                const resolved = tokens.map(token => {
                    if (!token) return token;

                    const phMatch = token.match(/^__YNPH_(\d+)__$/);
                    if (phMatch) {
                        return placeholders[Number(phMatch[1])];
                    }

                    const lower = token.toLowerCase();
                    if (Object.prototype.hasOwnProperty.call(REVERSE_DICTIONARY, lower)) {
                        translatedCount++;
                        return REVERSE_DICTIONARY[lower];
                    }

                    return token;
                }).join("");

                return { text: resolved, count: translatedCount };
            }

            /**
             * Perform live translation and update UI
             */
            function updateTranslation() {
                const rawInput = sourceInput.value;

                if (!rawInput.trim()) {
                    currentRawTranslation = "";
                    targetOutput.innerHTML = '<span class="placeholder-text">Translation appears here automatically...</span>';
                    matchStats.textContent = "0 words translated";
                    return;
                }

                const outcome = isEnglishToYarnglish
                    ? translateEnglishToYarnglish(rawInput)
                    : translateYarnglishToEnglish(rawInput);

                currentRawTranslation = outcome.text;
                targetOutput.textContent = outcome.text;
                matchStats.textContent = `${outcome.count} ${outcome.count === 1 ? "word" : "words"} translated`;
            }

            /**
             * Update UI labels when translation direction changes
             */
            function syncDirectionUI() {
                if (isEnglishToYarnglish) {
                    sourceLangPill.textContent = "English";
                    targetLangPill.textContent = "Yarnglish";
                    inputHeaderLabel.textContent = "English Input";
                    outputHeaderLabel.textContent = "Yarnglish Output";
                    sourceInput.placeholder = "Type here... e.g. I am a boy, you are a girl!";
                    swapIcon.style.transform = "rotate(0deg)";
                } else {
                    sourceLangPill.textContent = "Yarnglish";
                    targetLangPill.textContent = "English";
                    inputHeaderLabel.textContent = "Yarnglish Input";
                    outputHeaderLabel.textContent = "English Output";
                    sourceInput.placeholder = "Type Yarnglish here... e.g. piep pape poi, eepaap pipe gipipi!";
                    swapIcon.style.transform = "rotate(180deg)";
                }
            }

            /**
             * Swap translation direction and move current translation into input
             */
            function swapLanguages() {
                isEnglishToYarnglish = !isEnglishToYarnglish;

                if (currentRawTranslation.trim()) {
                    sourceInput.value = currentRawTranslation;
                }

                syncDirectionUI();
                updateTranslation();
            }

            /**
             * Render interactive dictionary cards
             */
            function renderDictionary(filterText = "") {
                const query = filterText.trim().toLowerCase();
                const entries = Object.entries(YARNGLISH_DICTIONARY).filter(([en, yn]) => {
                    return en.toLowerCase().includes(query) || yn.toLowerCase().includes(query);
                });

                dictionaryGrid.innerHTML = "";

                if (entries.length === 0) {
                    const empty = document.createElement("div");
                    empty.className = "empty-dict";
                    empty.textContent = `No dictionary matches found for "${filterText}".`;
                    dictionaryGrid.appendChild(empty);
                    return;
                }

                entries.forEach(([enWord, ynWord]) => {
                    const chip = document.createElement("button");
                    chip.type = "button";
                    chip.className = "dict-chip";
                    chip.title = `Click to insert "${isEnglishToYarnglish ? enWord : ynWord}"`;

                    const enDiv = document.createElement("div");
                    enDiv.className = "dict-en";
                    enDiv.textContent = enWord;

                    const ynDiv = document.createElement("div");
                    ynDiv.className = "dict-yn";
                    ynDiv.textContent = ynWord;

                    chip.appendChild(enDiv);
                    chip.appendChild(ynDiv);

                    chip.addEventListener("click", () => {
                        const wordToInsert = isEnglishToYarnglish ? enWord : ynWord;
                        const existing = sourceInput.value;
                        const needsSpace = existing.length > 0 && !/\s$/.test(existing);
                        sourceInput.value = existing + (needsSpace ? " " : "") + wordToInsert;
                        sourceInput.focus();
                        updateTranslation();
                        showToast(`Inserted "${wordToInsert}"`);
                    });

                    dictionaryGrid.appendChild(chip);
                });
            }

            /**
             * Copy translated result to clipboard
             */
            function copyResult() {
                if (!currentRawTranslation.trim()) {
                    showToast("Nothing to copy yet");
                    return;
                }

                const textToCopy = currentRawTranslation;

                const onCopySuccess = () => {
                    copyBtnText.textContent = "Copied!";
                    showToast("Copied translation to clipboard");
                    setTimeout(() => {
                        copyBtnText.textContent = "Copy";
                    }, 1800);
                };

                const fallbackCopy = () => {
                    const tempArea = document.createElement("textarea");
                    tempArea.value = textToCopy;
                    tempArea.setAttribute("readonly", "");
                    tempArea.style.position = "fixed";
                    tempArea.style.left = "-9999px";
                    document.body.appendChild(tempArea);
                    tempArea.select();
                    try {
                        document.execCommand("copy");
                        onCopySuccess();
                    } catch (err) {
                        showToast("Could not copy automatically");
                    }
                    document.body.removeChild(tempArea);
                };

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(textToCopy).then(onCopySuccess).catch(fallbackCopy);
                } else {
                    fallbackCopy();
                }
            }

            // Event Listeners
            sourceInput.addEventListener("input", updateTranslation);
            swapBtn.addEventListener("click", swapLanguages);

            sourceLangPill.addEventListener("click", () => {
                if (!isEnglishToYarnglish) swapLanguages();
            });

            targetLangPill.addEventListener("click", () => {
                if (isEnglishToYarnglish) swapLanguages();
            });

            clearBtn.addEventListener("click", () => {
                sourceInput.value = "";
                sourceInput.focus();
                updateTranslation();
            });

            copyBtn.addEventListener("click", copyResult);

            dictSearch.addEventListener("input", (e) => {
                renderDictionary(e.target.value);
            });

            // Sample buttons
            document.querySelectorAll(".sample-chip").forEach(btn => {
                btn.addEventListener("click", () => {
                    sourceInput.value = isEnglishToYarnglish
                        ? btn.getAttribute("data-en")
                        : btn.getAttribute("data-yn");
                    updateTranslation();
                });
            });

            // Initialize App
            syncDirectionUI();
            renderDictionary();
        })();
    </script>
</body>
</html>
